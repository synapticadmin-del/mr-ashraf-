<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الأخطاء الشائعة | فُصْحَى — أ. أشرف سليم</title>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg?v=4" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png?v=4" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png?v=4" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800;900&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="platform.js?v=1"></script>
  <link rel="stylesheet" href="platform.css?v=1" />
</head>
<body class="bg-fusha-cream text-slate-800 font-cairo antialiased min-h-screen flex flex-col selection:bg-neon-lime selection:text-space-950">

  <div id="app-header"></div>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-6">

    <!-- Orange hero (like screenshot) -->
    <div class="rounded-3xl p-6 sm:p-8 text-white shadow-lg relative overflow-hidden" style="background:linear-gradient(135deg,#96690B,#D49420)">
      <div class="absolute -end-10 -top-16 w-64 h-64 rounded-full bg-white/10 blur-3xl pointer-events-none"></div>
      <div class="relative z-10 flex items-start gap-4">
        <div class="w-14 h-14 rounded-2xl bg-white/15 border border-white/20 flex items-center justify-center shrink-0"><i data-lucide="alert-triangle" class="w-7 h-7"></i></div>
        <div>
          <h1 class="font-alexandria font-black text-2xl sm:text-3xl">الأخطاء الشائعة</h1>
          <p class="text-sm text-white/85 mt-2 font-medium max-w-xl leading-relaxed">أشهر الغلطات اللي بيقع فيها طلاب الثانوية في العربي — اتعلمها هنا عشان متقعش فيها يوم الامتحان ⚠️</p>
        </div>
      </div>
    </div>

    <!-- Subject tabs -->
    <div class="touch-swipe-rail w-full" id="subjectTabs"></div>

    <div id="cmList" class="grid gap-4 sm:grid-cols-2"></div>
  </main>

  <div id="app-footer"></div>

  <script>
    FUSHA.mount('more');
    if (window.lucide) window.lucide.createIcons();

    const esc = FUSHA.esc;
    const SUBJECTS = [
      { id: 'نحو', label: 'النحو', icon: 'pen-line' },
      { id: 'بلاغة', label: 'البلاغة', icon: 'sparkles' },
      { id: 'قراءة', label: 'القراءة', icon: 'book-open' },
      { id: 'إملاء', label: 'الإملاء', icon: 'spell-check' },
      { id: 'أدب', label: 'الأدب', icon: 'landmark' },
    ];

    const ITEMS = [
      { sub: 'نحو', title: '«إنَّ» و«أنَّ»', wrong: 'كتبت «ان العلم في الصدور» بنون واحدة', right: '«إنَّ» حرف مشبه بالفعل مشدد دايمًا بعد القول، و«أنَّ» المخففة نادرة — الخطأ في التشديد بيقلب الإعراب.' },
      { sub: 'نحو', title: 'جمع المؤنث السالم', wrong: '«شاهدتُ المعلماتُ في المدرسة»', right: 'جمع المؤنث السالم يُنصب بالكسرة مش الفتحة: «شاهدتُ المعلماتِ».' },
      { sub: 'نحو', title: 'كان وأخواتها', wrong: '«ما زال الطالب مجتهدٌ» بالرفع', right: 'الناسخ الناقص يرفع الاسم وينصب الخبر: «ما زال الطالب مجتهدًا».' },
      { sub: 'بلاغة', title: 'تشبيه × استعارة', wrong: 'اعتبرت كل صورة فيها «كان» استعارة', right: 'الاستعارة تشبيه حُذف أحد طرفيه — لو الأداة موجودة فهو تشبيه مهما كان المعنى.' },
      { sub: 'بلاغة', title: 'الكناية', wrong: '«طويل النجاد» اعتبرتها تشبيه', right: 'كناية عن موصوف — النسبة (طول النجاد) تدل على طول القامة بدون تشبيه.' },
      { sub: 'قراءة', title: 'الفكرة المحورية', wrong: 'اختيار تفصيلة من وسط النص كفكرة رئيسية', right: 'الفكرة المحورية هي اللي النص كله بيدور حواليها — مش مثال ولا برهان جزئي.' },
      { sub: 'إملاء', title: 'التاء المربوطة والمفتوحة', wrong: '«المدرسه كبيرة» بتاء مربوطة في كل مكان', right: 'التاء المربوطة للمفرد المؤنث وأسماء الأعلام الأنثوية؛ جمع التكسير بياخد تاء مفتوحة غالبًا: «مدارس».' },
      { sub: 'إملاء', title: 'الألف المقصورة', wrong: '«سعى» مكتوبة «سعا»', right: 'الفعل الثلاثي المهموز/المعتل الآخر بالواو أو الياء أصله الياء → تُكتب ألف مقصورة على صورة ياء «سعى».' },
      { sub: 'أدب', title: 'مدرسة الديوان × أبولو', wrong: 'خلط أسماء الرواد بين المدرستين', right: 'الديوان: عقاد ومازني وشكري (1921) — أبولو: أبو شادي ونخلة وحمودة (1932).' },
      { sub: 'أدب', title: 'النثر الفني', wrong: 'اعتبار المقالة الصحفية نثرًا فنيًا دائمًا', right: 'النثر الفني يشترط الصنعة والتخيّل — المقالة الإخبارية نثر وظيفي.' },
    ];

    let active = 'نحو';

    function paintTabs() {
      document.getElementById('subjectTabs').innerHTML = SUBJECTS.map(s => `
        <button class="sub-btn touch-swipe-pill transition flex items-center gap-1.5 cursor-pointer ${active === s.id ? 'bg-[#96690B] text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-stone-100 border border-stone-200'}" data-sub="${esc(s.id)}">
          <i data-lucide="${s.icon}" class="w-3.5 h-3.5 ${active === s.id ? 'text-white' : 'text-[#96690B]'}"></i><span>${s.label}</span>
        </button>`).join('');
      document.querySelectorAll('.sub-btn').forEach(b => b.addEventListener('click', () => { active = b.dataset.sub; paintTabs(); render(); }));
      if (window.lucide) window.lucide.createIcons();
    }

    function render() {
      const list = ITEMS.filter(i => i.sub === active);
      document.getElementById('cmList').innerHTML = list.map(i => `
        <article class="bg-white rounded-3xl border border-stone-200 shadow-sm p-5 space-y-3">
          <div class="flex items-center gap-2">
            <span class="w-9 h-9 rounded-xl bg-[#96690B]/10 text-[#96690B] flex items-center justify-center"><i data-lucide="alert-triangle" class="w-4.5 h-4.5"></i></span>
            <h3 class="font-alexandria font-black text-sm text-space-900">${esc(i.title)}</h3>
          </div>
          <div class="rounded-2xl border border-rose-200 bg-rose-50/60 p-3.5">
            <p class="text-[10px] font-black text-rose-500 mb-1">الغلط الشائع ❌</p>
            <p class="text-xs font-bold text-slate-700 leading-relaxed">${esc(i.wrong)}</p>
          </div>
          <div class="rounded-2xl border border-emerald-200 bg-emerald-50/60 p-3.5">
            <p class="text-[10px] font-black text-emerald-600 mb-1">الصح ✅</p>
            <p class="text-xs font-bold text-slate-700 leading-relaxed">${esc(i.right)}</p>
          </div>
        </article>`).join('');
      if (window.lucide) window.lucide.createIcons();
    }

    paintTabs(); render();
  </script>
</body>
</html>
