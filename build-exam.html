<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ابني امتحانك | فُصْحَى — أ. أشرف سليم</title>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg?v=4" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png?v=4" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png?v=4" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800;900&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="platform.js?v=1"></script>
  <link rel="stylesheet" href="platform.css?v=1" />
</head>
<body class="bg-fusha-cream text-slate-800 font-cairo antialiased min-h-screen flex flex-col selection:bg-neon-lime selection:text-space-950">

  <div id="app-header"></div>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-6">

    <div id="heroSlot"></div>

    <!-- 1. الفصول -->
    <section class="bg-white rounded-3xl border border-stone-200 shadow-sm p-5 sm:p-7 space-y-4">
      <h2 class="font-alexandria font-black text-base text-space-900 flex items-center gap-2">
        <span class="w-7 h-7 rounded-lg bg-royal-blue text-white text-xs font-black flex items-center justify-center">1</span>
        اختار الفصول والأقسام
      </h2>
      <div id="chaptersWrap" class="flex flex-wrap gap-2"></div>
    </section>

    <!-- 2. إعدادات -->
    <section class="bg-white rounded-3xl border border-stone-200 shadow-sm p-5 sm:p-7 space-y-5">
      <h2 class="font-alexandria font-black text-base text-space-900 flex items-center gap-2">
        <span class="w-7 h-7 rounded-lg bg-royal-blue text-white text-xs font-black flex items-center justify-center">2</span>
        إعدادات الامتحان
      </h2>
      <div class="grid sm:grid-cols-2 gap-5">
        <div>
          <label class="text-xs font-bold text-slate-600 block mb-2">عنوان الامتحان (اختياري)</label>
          <input id="examTitle" type="text" placeholder="مثال: مراجعة نحو الوحدة الأولى" class="w-full px-4 py-3 rounded-2xl bg-fusha-cream border border-stone-200 text-sm text-space-900 placeholder:text-slate-400 focus:outline-none focus:border-neon-lime transition" />
        </div>
        <div>
          <label class="text-xs font-bold text-slate-600 block mb-2">مدة الامتحان</label>
          <div id="durRow" class="flex gap-2"></div>
        </div>
      </div>
      <div>
        <label class="text-xs font-bold text-slate-600 block mb-2">عدد الأسئلة</label>
        <div id="qcRow2" class="flex flex-wrap gap-2"></div>
      </div>
    </section>

    <!-- 3. إثبات التحويل -->
    <section class="bg-white rounded-3xl border border-stone-200 shadow-sm p-5 sm:p-7 space-y-4">
      <h2 class="font-alexandria font-black text-base text-space-900 flex items-center gap-2">
        <span class="w-7 h-7 rounded-lg bg-royal-blue text-white text-xs font-black flex items-center justify-center">3</span>
        إثبات التحويل <span class="text-[10px] font-bold text-slate-400">(لو الامتحان مدفوع)</span>
      </h2>
      <div id="dropzone" class="dropzone rounded-3xl border-2 border-dashed border-stone-300 bg-fusha-cream p-8 text-center cursor-pointer transition">
        <input type="file" id="receiptInput" accept="image/*" class="hidden" />
        <div id="dzEmpty">
          <div class="w-14 h-14 mx-auto rounded-2xl bg-white border border-stone-200 flex items-center justify-center mb-3"><i data-lucide="image-plus" class="w-6 h-6 text-royal-blue"></i></div>
          <p class="text-sm font-black text-space-900">ارفع صورة إيصال التحويل</p>
          <p class="text-[11px] font-bold text-slate-400 mt-1">فودافون كاش / إنستاباي / إيصال السنتر — PNG أو JPG</p>
        </div>
        <div id="dzPreview" class="hidden items-center justify-center gap-3">
          <img id="dzImg" class="w-14 h-14 rounded-xl object-cover border border-stone-200" alt="الإيصال" />
          <div class="text-start">
            <p id="dzName" class="text-xs font-black text-space-900"></p>
            <p class="text-[10px] font-bold text-emerald-600 flex items-center gap-1"><i data-lucide="check-circle-2" class="w-3 h-3"></i>اترفعت — دوس للتغيير</p>
          </div>
        </div>
      </div>
    </section>

    <button id="submitExam" class="w-full py-4 rounded-2xl bg-neon-lime hover:bg-neon-limeHover text-space-950 font-alexandria font-black text-sm shadow-lg shadow-neon-lime/20 transition cursor-pointer flex items-center justify-center gap-2 transform hover:-translate-y-0.5">
      <i data-lucide="send" class="w-4 h-4"></i><span>أرسل الطلب للإدارة</span>
    </button>

    <!-- طلباتي -->
    <section class="space-y-3">
      <h2 class="font-alexandria font-black text-base text-space-900 flex items-center gap-2"><i data-lucide="list-checks" class="w-5 h-5 text-royal-blue"></i> طلباتي</h2>
      <div id="requestsList" class="space-y-3"></div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script>
    FUSHA.mount('more');
    document.getElementById('heroSlot').outerHTML = FUSHA.hero('file-pen-line', 'ابني امتحانك', 'اختار الأقسام وعدد الأسئلة والمدة — والإدارة هتجهزلك امتحان مخصص 📝');
    if (window.lucide) window.lucide.createIcons();

    const esc = FUSHA.esc;
    const CHAPTERS = ['النحو — كان وأخواتها', 'النحو — إنّ وأخواتها', 'البلاغة — التشبيه', 'البلاغة — الاستعارة والكناية', 'القراءة والنصوص', 'الإملاء والتراكيب', 'الأدب — العصر الجاهلي', 'الأدب — العصر الإسلامي'];
    const DURS = [15, 30, 45, 60];
    const QCS = [10, 20, 30, 50];

    let pickedChapters = new Set();
    let duration = 30, qCount = 20, receipt = null;

    function paintChapters() {
      document.getElementById('chaptersWrap').innerHTML = CHAPTERS.map(c => `
        <button class="ch-btn px-3.5 py-2 rounded-xl border-2 text-[11px] font-black transition cursor-pointer ${pickedChapters.has(c) ? 'bg-royal-blue text-white border-royal-blue' : 'bg-white text-slate-600 border-stone-200 hover:border-royal-blue/50'}" data-ch="${esc(c)}">${esc(c)}</button>`).join('');
      document.querySelectorAll('.ch-btn').forEach(b => b.addEventListener('click', () => {
        const c = b.dataset.ch;
        pickedChapters.has(c) ? pickedChapters.delete(c) : pickedChapters.add(c);
        paintChapters();
      }));
    }

    function paintDur() {
      document.getElementById('durRow').innerHTML = DURS.map(d => `
        <button class="dur-btn px-4 py-2.5 rounded-xl border text-xs font-black transition cursor-pointer ${d === duration ? 'bg-royal-blue text-white border-royal-blue' : 'bg-white text-slate-600 border-stone-200 hover:border-royal-blue'}" data-d="${d}">${d} دقيقة</button>`).join('');
      document.querySelectorAll('.dur-btn').forEach(b => b.addEventListener('click', () => { duration = Number(b.dataset.d); paintDur(); }));
    }
    function paintQc() {
      document.getElementById('qcRow2').innerHTML = QCS.map(n => `
        <button class="qc-btn px-4 py-2.5 rounded-xl border text-xs font-black transition cursor-pointer ${n === qCount ? 'bg-royal-blue text-white border-royal-blue' : 'bg-white text-slate-600 border-stone-200 hover:border-royal-blue'}" data-q="${n}">${n} سؤال</button>`).join('');
      document.querySelectorAll('.qc-btn').forEach(b => b.addEventListener('click', () => { qCount = Number(b.dataset.q); paintQc(); }));
    }

    // dropzone
    const dz = document.getElementById('dropzone'), fi = document.getElementById('receiptInput');
    dz.addEventListener('click', () => fi.click());
    dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('over'));
    dz.addEventListener('drop', (e) => { e.preventDefault(); dz.classList.remove('over'); if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]); });
    fi.addEventListener('change', () => { if (fi.files[0]) setFile(fi.files[0]); });
    function setFile(f) {
      receipt = f;
      document.getElementById('dzEmpty').classList.add('hidden');
      const pv = document.getElementById('dzPreview');
      pv.classList.remove('hidden'); pv.classList.add('flex');
      document.getElementById('dzName').textContent = f.name;
      const r = new FileReader();
      r.onload = () => document.getElementById('dzImg').src = r.result;
      r.readAsDataURL(f);
      if (window.lucide) window.lucide.createIcons();
    }

    // requests (localStorage)
    const RKEY = 'fusha_exam_requests';
    const getReqs = () => { try { return JSON.parse(localStorage.getItem(RKEY)) || []; } catch { return []; } };
    if (!localStorage.getItem('fusha_exam_requests_seeded')) {
      localStorage.setItem(RKEY, JSON.stringify([{ id: 1, title: 'مراجعة بلاغة الوحدة الأولى', chapters: 3, questions: 30, duration: 45, status: 'جاهز — ابدأ الامتحان', ready: true, created: '٢٥ سبتمبر' }]));
      localStorage.setItem('fusha_exam_requests_seeded', '1');
    }
    function renderReqs() {
      const list = getReqs();
      document.getElementById('requestsList').innerHTML = list.length ? list.map(r => `
        <div class="bg-white rounded-3xl border border-stone-200 shadow-sm p-4 sm:p-5 flex items-center gap-4 flex-wrap">
          <span class="w-11 h-11 rounded-2xl ${r.ready ? 'bg-emerald-50 text-emerald-500' : 'bg-amber-50 text-amber-500'} flex items-center justify-center shrink-0"><i data-lucide="${r.ready ? 'check-circle-2' : 'clock'}" class="w-5 h-5"></i></span>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-black text-space-900 truncate">${esc(r.title)}</p>
            <p class="text-[11px] font-bold text-slate-500 mt-0.5">${r.chapters} أقسام • ${r.questions} سؤال • ${r.duration} دقيقة • ${esc(r.created)}</p>
          </div>
          <span class="px-3 py-1.5 rounded-lg text-[10px] font-black ${r.ready ? 'bg-emerald-50 text-emerald-600 border border-emerald-200' : 'bg-amber-50 text-amber-600 border border-amber-200'}">${esc(r.status)}</span>
        </div>`).join('')
      : `<div class="bg-white rounded-3xl border border-stone-200 p-10 text-center"><p class="text-xs font-bold text-slate-400">مفيش طلبات لسه — ابني أول امتحان فوق 👆</p></div>`;
      if (window.lucide) window.lucide.createIcons();
    }

    document.getElementById('submitExam').addEventListener('click', () => {
      if (!pickedChapters.size) { FUSHA.toast('اختار قسم واحد على الأقل الأول ⚠️', false); return; }
      const title = document.getElementById('examTitle').value.trim() || `امتحان مخصص — ${pickedChapters.size} أقسام`;
      const list = getReqs();
      list.unshift({ id: Date.now(), title, chapters: pickedChapters.size, questions: qCount, duration, status: 'قيد التجهيز — هيوصلك إشعار', ready: false, created: 'دلوقتي' });
      localStorage.setItem(RKEY, JSON.stringify(list));
      FUSHA.toast('الطلب اتبعت للإدارة ✅');
      renderReqs();
      document.getElementById('requestsList').scrollIntoView({ behavior: 'smooth' });
    });

    paintChapters(); paintDur(); paintQc(); renderReqs();
  </script>
</body>
</html>
